# Builds the APK on every push. A tag like v0.1.0 also publishes a GitHub release.
#
# The signing key is the one thing that can't be replaced, so it's kept away from
# everything else: Gradle builds the APK unsigned (it never sees the key), then one
# short step signs it with Android's own apksigner and deletes the key at once.
# Actions are pinned to exact commits (the version is in the comment after each).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Test and build (unsigned)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # A build signed with a throwaway key can't update the installed app,
            # so don't make one at all.
            echo "::error::The KEYSTORE_BASE64 secret is missing (repo Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::The KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          KEY="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$KEY"' EXIT          # the key is gone when this step ends, however it ends
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEY"
          "$TOOLS/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" sign --ks "$KEY" --ks-key-alias luxtunes \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/aligned.apk"

      - name: Show the signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -i "SHA-256"

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "LuxTunes-Mobile-${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LuxTunes-Mobile-${{ github.run_number }}
          path: LuxTunes-Mobile-*.apk

  # Only for a v… tag: publish the signed APK. This job never has the key; it's the
  # only one allowed to write to the repository (to make the release).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: LuxTunes-Mobile-${{ github.run_number }}

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: LuxTunes-Mobile-*.apk
